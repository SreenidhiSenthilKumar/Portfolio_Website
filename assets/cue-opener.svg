    33.33% { transform: scaleY(0.1); }
    34.55% { transform: scaleY(0.1); }
    35.76% { transform: scaleY(1); }
    46.97% { transform: scaleY(1); }
    47.88% { transform: scaleY(0.1); }
    48.48% { transform: scaleY(0.1); }
    49.70% { transform: scaleY(1); }
    89.39% { transform: scaleY(1); }
    90.91% { transform: scaleY(0.1); }
    91.52% { transform: scaleY(0.1); }
