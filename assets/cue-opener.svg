      <circle cx="1378" cy="656" r="95" fill="url(#glow)" mask="url(#shape)"/>
      <circle cx="1345" cy="704" r="33" fill="#fff"/><circle cx="1407" cy="706" r="33" fill="#fff"/>
      <g class="look">
        <circle class="pupil" cx="1345" cy="704" r="20" fill="#131213"/><circle class="pupil" cx="1407" cy="706" r="20" fill="#131213"/>
