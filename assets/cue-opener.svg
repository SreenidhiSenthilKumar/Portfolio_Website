<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1598 944" width="1598" height="944">
  <title>Cue opener</title>
  <defs>
    <linearGradient id="body" gradientUnits="userSpaceOnUse" x1="1375" y1="561" x2="1375" y2="836">
      <stop offset="0" stop-color="#9aa9d4"/>
      <stop offset=".45" stop-color="#b0959f"/>
      <stop offset="1" stop-color="#e07c6f"/>
    </linearGradient>
    <radialGradient id="glow" gradientUnits="userSpaceOnUse" cx="1378" cy="656" r="95">
      <stop offset="0" stop-color="#93acdd" stop-opacity=".95"/>
      <stop offset="1" stop-color="#93acdd" stop-opacity="0"/>
    </radialGradient>
    <mask id="shape">
      <polygon points="1375.0,575.0 1412.6,659.2 1504.3,669.0 1435.9,730.8 1454.9,821.0 1375.0,775.0 1295.1,821.0 1314.1,730.8 1245.7,669.0 1337.4,659.2" fill="#fff" stroke="#fff" stroke-width="14" stroke-linejoin="round"/>
    </mask>
  </defs>
  <style>
    .hop, .spin, .look, .pupil { animation: 13200ms ease-in-out infinite; }
