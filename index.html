<body class="home-page">

    <section class="hero" data-pin>

              <button class="inspire__item" type="button" data-label="Books" data-spot="88,10"><span class="inspire__icon" style="--src:url(assets/icons/book.svg);--fsrc:url(assets/icons/fill/book.png);--fill:#f7b8cd"></span></button>
              <button class="inspire__item" type="button" data-label="Tea" data-spot="38,42"><span class="inspire__icon" style="--src:url(assets/icons/tea.svg);--fsrc:url(assets/icons/fill/tea.png);--fill:#f7b8cd"></span></button>

        </div>
        <h1 class="hero__name"><span>Sreenidhi</span> <span>Senthil</span> <span>Kumar</span></h1>
